<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="MajiGuard — Data-driven, ML-powered Decision Support System for Water Point Management."
    />
    <title>MajiGuard</title>
    <script>
      // Applies the stored theme before first paint so a dark-mode reload
      // never flashes the light palette. Light is the product default.
      (() => {
        try {
          const stored = localStorage.getItem('majiguard.theme')
          const theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
